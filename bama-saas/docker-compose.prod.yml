# Production stack: Postgres, Django (gunicorn), the built SPA behind nginx, worker.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Standalone rather than an overlay: the frontend service is structurally
# different in prod (static bundle behind nginx, not the Vite dev server), and
# the edge wiring reads better as one explicit definition than as a diff.
#
# Only `frontend` joins the shared `edge` network (Caddy terminates TLS there);
# everything else stays internal.
#
# `name:` pins the Compose project name, and therefore the named-volume prefix,
# instead of letting it derive from the invoking directory. Deploy runs from a
# git checkout, and a project name that silently changed because of *where* the
# repo was cloned would make Compose spin up fresh, empty volumes next to the
# real ones — the data would look gone.
name: bama-saas

x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

x-django-env: &django-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bama_saas}
  DJANGO_SETTINGS_MODULE: config.settings
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:?set ALLOWED_HOSTS}
  CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS}
  BAMA_MAX_ADS: ${BAMA_MAX_ADS:-50000}
  BAMA_PAGE_PAUSE: ${BAMA_PAGE_PAUSE:-1.5}
  BAMA_REQUEST_TIMEOUT: ${BAMA_REQUEST_TIMEOUT:-20}
  BAMA_COOKIE: ${BAMA_COOKIE:-}
  BAMA_TELEGRAM_TOKEN: ${BAMA_TELEGRAM_TOKEN:-}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  # Where trained model artifacts live. Every service agrees on the path; they
  # disagree on whether the mount is writable — see the `ml` service below.
  ML_ARTIFACT_DIR: /artifacts

services:
  postgres:
    image: postgres:16-alpine
    container_name: bama-postgres
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bama_saas}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bama_saas}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  # Proxied listing photos and the deal board's computed window. Capped and
  # LRU-evicting rather than unbounded: this VPS runs more than one stack, and
  # an image cache is exactly the kind of thing that grows until something else
  # gets OOM-killed. Nothing in here is authoritative, so eviction is free.
  # `--save ""` disables snapshotting for the same reason.
  redis:
    image: redis:7-alpine
    container_name: bama-redis
    restart: unless-stopped
    logging: *logging
    command: >
      redis-server --maxmemory ${REDIS_MAXMEMORY:-512mb}
                   --maxmemory-policy allkeys-lru
                   --save ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  django:
    build: .
    container_name: bama-django
    restart: unless-stopped
    logging: *logging
    environment: *django-env
    # `:ro` on the artifacts, and it is load-bearing rather than tidiness. A web
    # worker that can overwrite a model file can change what every reader is
    # told without a deploy, a migration or a registry row — and the registry is
    # the only record of which model produced which number.
    volumes:
      - staticfiles:/app/staticfiles
      - ml_artifacts:/artifacts:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    # No account seeding. Staff is granted by createsuperuser, not by signup.
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      internal:
        aliases: [backend]   # ui/web/nginx.conf proxies /api/ and /admin/ here

  frontend:
    build:
      context: ./ui/web
      dockerfile: Dockerfile.prod
      # The origin the canonical link, the sitemap and robots.txt name. Left
      # unset it falls back to the deployed host, so a `.env` without it builds
      # the same bundle as before; setting it is what makes moving to a real
      # domain a deploy rather than a code change.
      args:
        VITE_SITE_URL: ${VITE_SITE_URL:-}
    container_name: bama-frontend
    restart: unless-stopped
    logging: *logging
    depends_on:
      django: { condition: service_healthy }
    volumes: [staticfiles:/static:ro]
    expose: ["80"]
    networks:
      internal:
      edge:
        aliases: [bama-frontend]

  worker:
    build: .
    container_name: bama-worker
    restart: unless-stopped
    logging: *logging
    environment: *django-env
    # Read-only too: the worker *scores* with the models (`ml_score` on the hot
    # tick) but never fits one. Only `ml` writes here.
    volumes: [ml_artifacts:/artifacts:ro]
    depends_on:
      django: { condition: service_healthy }
    command: sh deploy/worker.sh
    networks: [internal]

  # Training. Same image tag as django and worker — one build to verify, one set
  # of dependencies — with a different command and the only writable mount on
  # the artifact volume.
  #
  # Separate from `worker` because this is the one job here that saturates a CPU
  # for minutes rather than seconds, and on a VPS running three stacks that
  # would otherwise show up as the crawl mysteriously slowing down. `cpus`
  # caps it so a fit cannot starve gunicorn even so.
  ml:
    build: .
    container_name: bama-ml
    restart: unless-stopped
    logging: *logging
    environment: *django-env
    volumes: [ml_artifacts:/artifacts]
    depends_on:
      django: { condition: service_healthy }
    command: sh deploy/train.sh
    deploy:
      resources:
        limits: { cpus: "${ML_CPUS:-1.5}", memory: "${ML_MEMORY:-1500m}" }
    networks: [internal]

volumes:
  postgres_data:
  staticfiles:
  # Trained models. Not backed up and it does not need to be: every artifact is
  # reproducible from the database by one `bama train`, and a missing file makes
  # inference refuse rather than fail — see `registry.load`.
  ml_artifacts:

networks:
  internal:
  edge:
    external: true
    name: vps-edge
