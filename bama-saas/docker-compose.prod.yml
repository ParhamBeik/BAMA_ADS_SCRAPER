# Production stack: Postgres, Django (gunicorn), the built SPA behind nginx, worker.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Standalone rather than an overlay: the frontend service is structurally
# different in prod (static bundle behind nginx, not the Vite dev server), and
# the edge wiring reads better as one explicit definition than as a diff.
#
# Only `frontend` joins the shared `edge` network (Caddy terminates TLS there);
# everything else stays internal.
#
# `name:` pins the Compose project name, and therefore the named-volume prefix,
# instead of letting it derive from the invoking directory. Deploy runs from a
# git checkout, and a project name that silently changed because of *where* the
# repo was cloned would make Compose spin up fresh, empty volumes next to the
# real ones — the data would look gone.
name: bama-saas

x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

x-django-env: &django-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bama_saas}
  DJANGO_SETTINGS_MODULE: config.settings
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:?set ALLOWED_HOSTS}
  CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS}
  BAMA_MAX_ADS: ${BAMA_MAX_ADS:-50000}
  BAMA_PAGE_PAUSE: ${BAMA_PAGE_PAUSE:-1.5}
  BAMA_REQUEST_TIMEOUT: ${BAMA_REQUEST_TIMEOUT:-20}
  BAMA_COOKIE: ${BAMA_COOKIE:-}
  BAMA_TELEGRAM_TOKEN: ${BAMA_TELEGRAM_TOKEN:-}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  # Where trained model artifacts live. Every service agrees on the path; they
  # disagree on whether the mount is writable — see the `ml` service below.
  ML_ARTIFACT_DIR: /artifacts

services:
  # Tuned, because it was running on stock settings. Measured 2026-09-04: the
  # database is 2,370 MB against the 128 MB default `shared_buffers`, and the
  # block cache hit ratio was 85.9% where an OLTP workload wants >99%. That is
  # not just a ratio — `EXPLAIN (BUFFERS)` on the population count came back
  # `read=5684 written=1740`, a *read* query evicting dirty pages to make room.
  #
  # 512 MB, not the usual "25% of RAM": the host has 15 GB but runs three other
  # stacks beside this one, and 512 MB already covers the hot set. The exact
  # command below was started against this same `postgres:16-alpine` tag on the
  # VPS before being written here, and all four settings plus the preload were
  # read back from a live `SHOW` — a wrong parameter here means the database
  # does not come back, so it is verified rather than reasoned about.
  #
  # `pg_stat_statements` is preloaded because it was available and unloaded, so
  # there was no way to ask "which statement is costing us" without a restart —
  # and that question came up immediately. It needs one statement after the
  # first restart, and then survives every later one:
  #
  #   docker exec bama-postgres psql -U postgres -d bama_saas \
  #     -c 'CREATE EXTENSION IF NOT EXISTS pg_stat_statements'
  #
  # NOTE: applying this restarts the database. It is a few seconds, `django`
  # waits on the healthcheck below, and the worker retries its tick — but it is
  # a restart, and a push to main deploys itself.
  postgres:
    image: postgres:16-alpine
    container_name: bama-postgres
    restart: unless-stopped
    logging: *logging
    command: >
      postgres -c shared_buffers=512MB
               -c effective_cache_size=2GB
               -c work_mem=16MB
               -c maintenance_work_mem=256MB
               -c shared_preload_libraries=pg_stat_statements
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bama_saas}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bama_saas}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  # Proxied listing photos and the deal board's computed window. Capped and
  # LRU-evicting rather than unbounded: this VPS runs more than one stack, and
  # an image cache is exactly the kind of thing that grows until something else
  # gets OOM-killed. Nothing in here is authoritative, so eviction is free.
  # `--save ""` disables snapshotting for the same reason.
  redis:
    image: redis:7-alpine
    container_name: bama-redis
    restart: unless-stopped
    logging: *logging
    command: >
      redis-server --maxmemory ${REDIS_MAXMEMORY:-512mb}
                   --maxmemory-policy allkeys-lru
                   --save ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  django:
    build: .
    container_name: bama-django
    restart: unless-stopped
    logging: *logging
    environment: *django-env
    # `:ro` on the artifacts, and it is load-bearing rather than tidiness. A web
    # worker that can overwrite a model file can change what every reader is
    # told without a deploy, a migration or a registry row — and the registry is
    # the only record of which model produced which number.
    volumes:
      - staticfiles:/app/staticfiles
      - ml_artifacts:/artifacts:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    # No account seeding. Staff is granted by createsuperuser, not by signup.
    # `--access-logfile -` keeps request-level evidence in `docker logs`. Without
    # it this container logged only its own boot, so "is that endpoint used?" and
    # "did that error reach a user?" had no answer. Django's own 500s reach the
    # same stdout via the `django.request` logger in config/settings.py — by
    # default they reach nothing at all in production.
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
             --worker-class gthread --threads 8 --access-logfile -"
    # `X-Forwarded-Proto: https` is not decoration — without it this check was
    # passing without ever reaching Django. The hardened profile sets
    # `SECURE_SSL_REDIRECT`, so a plain HTTP request is answered 301 by
    # SecurityMiddleware *before* routing, before any view and before the
    # database is touched. `curl -f` does not treat a 3xx as an error and does
    # not follow it without `-L`, so the probe got `http_code=301`, an empty
    # body and exit 0 — reporting healthy for anything that merely accepts a
    # connection on port 8000. `frontend`, `worker` and `ml` all gate their
    # start on this condition, so they were gating on the port being open.
    # Measured against the running container before the header was added.
    #
    # Still `/api/health/` and not `/api/db/health/`: this decides whether the
    # container is restarted, and a brief database blip should not cycle the web
    # tier. The deploy smoke-test in .github/workflows/deploy.yml probes both,
    # through Caddy, which sets this header itself.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-H", "X-Forwarded-Proto: https",
             "http://localhost:8000/api/health/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      internal:
        aliases: [backend]   # ui/web/nginx.conf proxies /api/ and /admin/ here

  frontend:
    build:
      context: ./ui/web
      dockerfile: Dockerfile.prod
      # The origin the canonical link, the sitemap and robots.txt name. Left
      # unset it falls back to the deployed host, so a `.env` without it builds
      # the same bundle as before; setting it is what makes moving to a real
      # domain a deploy rather than a code change.
      args:
        VITE_SITE_URL: ${VITE_SITE_URL:-}
    container_name: bama-frontend
    restart: unless-stopped
    logging: *logging
    depends_on:
      django: { condition: service_healthy }
    volumes: [staticfiles:/static:ro]
    expose: ["80"]
    networks:
      internal:
      edge:
        aliases: [bama-frontend]

  worker:
    build: .
    container_name: bama-worker
    restart: unless-stopped
    logging: *logging
    environment: *django-env
    # Read-only too: the worker *scores* with the models (`ml_score` on the hot
    # tick) but never fits one. Only `ml` writes here.
    volumes: [ml_artifacts:/artifacts:ro]
    depends_on:
      django: { condition: service_healthy }
    command: sh deploy/worker.sh
    networks: [internal]

  # Training. Same image tag as django and worker — one build to verify, one set
  # of dependencies — with a different command and the only writable mount on
  # the artifact volume.
  #
  # Separate from `worker` because this is the one job here that saturates a CPU
  # for minutes rather than seconds, and on a VPS running three stacks that
  # would otherwise show up as the crawl mysteriously slowing down. `cpus`
  # caps it so a fit cannot starve gunicorn even so.
  ml:
    build: .
    container_name: bama-ml
    restart: unless-stopped
    logging: *logging
    environment: *django-env
    volumes: [ml_artifacts:/artifacts]
    depends_on:
      django: { condition: service_healthy }
    command: sh deploy/train.sh
    deploy:
      resources:
        limits: { cpus: "${ML_CPUS:-1.5}", memory: "${ML_MEMORY:-1500m}" }
    networks: [internal]

volumes:
  postgres_data:
  staticfiles:
  # Trained models. Not backed up and it does not need to be: every artifact is
  # reproducible from the database by one `bama train`, and a missing file makes
  # inference refuse rather than fail — see `registry.load`.
  ml_artifacts:

networks:
  internal:
  edge:
    external: true
    name: vps-edge
