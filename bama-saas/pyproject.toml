[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bama-saas"
version = "0.2.0"
description = "Bama — used-car market intelligence (Django + DRF + PostgreSQL)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Django>=5.0,<6.0",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "django-filter>=24.2",
    "django-cors-headers>=4.4",
    "dj-database-url>=2.2",
    "psycopg[binary]>=3.2",
    "jdatetime>=4.1",
    "requests>=2.31",
    "gunicorn>=22.0",
    # Django's own RedisCache backend needs a client; there is no django-redis
    # here and none is wanted.
    "redis>=5.0",
]

[project.optional-dependencies]
# The learned layer. Kept as its own extra so the dependency weight is a
# deliberate choice rather than something the web app grew by accident, and so
# `apps/ml` can be imported (and refuse) on a host that does not have it.
#
# No `shap`: LightGBM computes exact TreeSHAP itself via
# `predict(..., pred_contrib=True)`, which is the same algorithm and the same
# numbers without pulling numba in behind it. No `pandas` either — the feature
# matrix is built straight out of `values_list` into a numpy array, and a
# DataFrame in between would be 50MB of dependency doing a transpose.
ml = [
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "joblib>=1.4",
]
#
# Not folded into `test` as a self-referential `bama-saas[ml]`: the Dockerfile
# reads these lists with tomllib and pip-installs the strings verbatim, so a
# self-reference would send it to PyPI for a package that only exists here.
# CI and the image both name the two extras explicitly instead.
test = ["pytest>=8.2", "pytest-django>=4.8"]
dev = ["pytest>=8.2", "pytest-django>=4.8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "config*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
# Declared, or pytest treats every `@pytest.mark.slow` as a typo and warns —
# which also means `-m "not slow"` silently selects nothing rather than skipping
# the LightGBM fits, so the marker existed but could not be used for what it is
# for. The tests that carry it actually train models.
markers = ["slow: fits a real model; minutes rather than milliseconds"]

# 100, not the default 88: the house style leans on long log-format strings and
# ORM chains that read worse when broken, and reflowing them is pure churn.
[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["**/migrations/*", ".venv", "ui"]

[tool.ruff.lint]
# E/F correctness, I import order, UP dead idioms, B likely bugs.
select = ["E", "F", "I", "UP", "B"]
# `datetime.timezone.utc` -> `datetime.UTC` is a 37-site rename that changes no
# behaviour, and `timezone` is already imported alongside `datetime` everywhere
# it appears. Not worth the diff.
ignore = ["UP017"]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately build long literal payloads and assert on them.
"tests/*" = ["E501"]
