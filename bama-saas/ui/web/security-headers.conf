# Included rather than inherited, and that is not a style choice: nginx drops
# every inherited `add_header` the moment a location defines one of its own, so
# a header set at server level silently vanishes from `/assets/` the moment that
# block adds a Cache-Control. Repeating the include is the only way to be sure.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
# No camera, microphone or geolocation is used anywhere in this app; saying so
# is what turns "we do not ask for it" into "the browser will not allow it".
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
# `object-src 'none'` and a locked `base-uri` are the two that actually stop the
# common injection routes. Styles need 'unsafe-inline' because Tailwind and the
# chart library both set element styles directly; scripts do not, so the
# valuable half of the policy is strict. Images allow data: and https: because
# ad photographs are proxied through this origin but SVG placeholders are
# inlined.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
