server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Text compression. `gzip_static` serves the .gz written at build time when
    # one exists, so the CPU is spent once in CI rather than on every request
    # from every visitor; `gzip on` covers anything that was not precompressed,
    # including proxied API responses.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml application/javascript application/json
        application/manifest+json image/svg+xml application/xml
        application/xml+rss text/javascript;

    # DRF's request.data path does not honor Django's DATA_UPLOAD_MAX_MEMORY_SIZE
    # until 3.17.2. Cap here so an oversized JSON POST dies at the proxy.
    client_max_body_size 2m;

    # Docker's embedded DNS. With a literal `proxy_pass http://backend:8000` nginx
    # resolves `backend` once at startup, so any recreate of django (new IP) that
    # did not also recreate this container turned every /api call into a 502 and
    # locked everyone out of login. A variable in proxy_pass makes nginx re-resolve
    # at request time, honouring this short TTL.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /assets/ {
        # Content-hashed by the bundler, so the URL changes whenever the bytes
        # do and this can be as long as the spec allows.
        #
        # One directive, not `expires 1y` as well: the two both emit a
        # Cache-Control and the response went out carrying it twice.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/conf.d/security-headers.conf;
    }

    location /static/ {
        alias /static/;
        add_header Cache-Control "public, max-age=3600" always;
        include /etc/nginx/conf.d/security-headers.conf;
    }

    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        include /etc/nginx/conf.d/security-headers.conf;
    }

    location /admin/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        include /etc/nginx/conf.d/security-headers.conf;
    }

    # The SPA shell, `/` included — there is no separate static entry document
    # any more, so an anonymous visitor to the root gets the app and the app
    # sends them to the sign-in form.
    #
    # Never cached: it is the document that names every hashed asset, so a stale
    # copy pins a visitor to a deployment that no longer exists and no amount of
    # asset cache-busting can rescue them. That matters more than usual on this
    # change: browsers have a `no-cache`-but-revalidatable copy of the old `/`,
    # which was a different document entirely.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/conf.d/security-headers.conf;
    }
}
