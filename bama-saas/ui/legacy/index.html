<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bama — Used-Car Market Intelligence</title>
  <link rel="stylesheet" href="assets/app.css" />
  <!-- Chart.js vendored locally: no build step, and works in networks where the
       CDN (jsdelivr) is blocked or throttled — relevant for end users in Iran. -->
  <script src="assets/vendor/chart.umd.min.js" defer></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/">
        <span class="brand-mark">باما</span>
        <span class="brand-name">Market Intel</span>
      </a>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-footer" id="sidebarFooter"></div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn" id="menuToggle" aria-label="Menu">☰</button>
        <h1 id="pageTitle" class="page-title">Dashboard</h1>
        <div class="topbar-spacer"></div>
        <div id="userMenu" class="user-menu"></div>
      </header>

      <main id="view" class="view">
        <div class="spinner-wrap"><div class="spinner"></div></div>
      </main>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="src/app.js"></script>
</body>
</html>
