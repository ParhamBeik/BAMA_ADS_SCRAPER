<!doctype html>
<meta charset="utf-8">
<title>verify</title>
<!-- Local Chart.js so it loads under --virtual-time-budget (CDN is frozen in virtual time). -->
<script src="assets/vendor/chart.umd.min.js"></script>
<div><canvas id="c1"></canvas><canvas id="c2"></canvas></div>
<h1 id="res">running</h1>
<!-- cache-bust query forces a fresh fetch of the module, bypassing Chrome's disk cache -->
<script type="module">
  import { lineChart, barChart } from "./src/charts.js?bust=1";
  const res = document.getElementById("res");
  try {
    lineChart(document.getElementById("c1"), {
      labels: ["a", "b", "c"],
      yToman: true,                                   // exercises tomanAxis() — the broken path
      datasets: [{ label: "median", data: [1.2e9, 1.5e9, 1.3e9] }],
    });
    barChart(document.getElementById("c2"), {
      labels: ["a", "b"],
      yToman: true,                                   // exercises tomanAxis() for bars too
      datasets: [{ label: "n", data: [40, 70] }],
    });
    const drew = document.getElementById("c1").width > 0;
    res.textContent = drew ? "OK charts drew" : "FAIL no draw";
  } catch (e) {
    res.textContent = "ERROR " + (e && e.message ? e.message : String(e));
  }
</script>
