# Continuous deployment to the VPS.
#
# Flow: push to main -> ci.yml runs in full on GitHub's machines -> if and only
# if it is green, a self-hosted runner *on the VPS* runs the pull-and-restart
# wrapper that already lives there.
#
# Why a runner and not SSH: GitHub's runners cannot reach the VPS at all — their
# connections never arrive (Iranian network filtering), while the VPS reaches
# GitHub fine. The runner dials out and collects the job, so nothing connects in.
#
# The runner runs as `bama-deploy`, which has no docker group and whose only
# sudo right is /opt/apps/deploy_bama.sh. The repo is public, so fork-PR
# workflows require approval for every outside contributor; a job that did get
# through would land in that near-empty account. Setup: deploy/CICD.md.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two pushes in quick succession must not build the same checkout at once —
# `git reset --hard` from one would land under the other's `docker compose build`.
# Not cancel-in-progress: aborting a half-finished deploy is worse than queueing.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: [self-hosted, bama-vps]
    environment: production
    steps:
      # The wrapper fetches origin/main into its own checkout and rebuilds, so
      # this job ships no code — it only says "go".
      - name: Pull and restart
        run: sudo /opt/apps/deploy_bama.sh

      # A deploy that "succeeded" but left the stack down is the failure mode
      # worth catching: compose returns 0 as soon as the containers are created,
      # long before Django can answer.
      - name: Smoke-test the running stack
        env:
          HEALTH_URL: ${{ secrets.VPS_HEALTH_URL }}
        run: |
          set -euo pipefail
          for endpoint in "api/health/" "api/db/health/"; do
            url="${HEALTH_URL%/}/$endpoint"
            echo "probing $url"
            for attempt in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$url" || echo 000)
              [ "$code" = "200" ] && { echo "  ok after ${attempt}x3s"; break; }
              [ "$attempt" -eq 30 ] && { echo "  FAILED: last status $code"; exit 1; }
              sleep 3
            done
          done
