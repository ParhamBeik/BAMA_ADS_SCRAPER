# Every push and PR. `deploy.yml` refuses to run unless all three jobs here pass,
# so this file is the definition of "safe to put on the VPS".
#
# The three jobs are independent on purpose: a frontend type error and a backend
# test failure are different problems, and finding both in one run beats fixing
# one, pushing, and waiting to discover the other.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:      # deploy.yml reuses this rather than duplicating the steps

defaults:
  run:
    working-directory: bama-saas

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bama_saas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bama_saas
      DJANGO_SETTINGS_MODULE: config.settings
      # pytest is in sys.modules during the run, which selects the permissive
      # profile in config/settings.py. Set explicitly so the intent is visible.
      DJANGO_DEBUG: "1"
      API_PUBLIC_READS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # `ml` as well as `test`: the learned models have a promotion gate, a
      # calibration check and a refusal threshold, and none of that is worth
      # having if CI cannot run it. The two extras are named explicitly rather
      # than `test` depending on `ml`, because the Dockerfile reads these lists
      # with tomllib and a self-referential extra would send it to PyPI.
      - run: pip install -e ".[test,ml]"

      # A model change without a migration passes every test and then breaks the
      # deploy, because the container runs `migrate` against a schema that no
      # longer matches the models. Catch it here instead.
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - run: pytest -q

  backend-hardened:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bama_saas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bama_saas
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_DEBUG: "1"
      API_PUBLIC_READS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[test,ml]"
      - run: pytest -q

      # The suite cannot cover this: `testenv.py` sets DJANGO_DEBUG=1 before
      # Django is configured, so every test runs the *local* profile and the
      # hardened one — HTTPS redirect, HSTS, secure cookies, nosniff — is
      # asserted by nothing. It currently passes Django's whole deployment
      # checklist with zero warnings, and that is worth pinning: the failure
      # mode is silent, ships straight to the VPS on a push to main, and is
      # invisible until somebody looks for a header that stopped being sent.
      #
      # DJANGO_DEBUG is cleared for this step alone. The key is generated rather
      # than hardcoded because settings.py refuses the dev key outright and
      # check --deploy separately rejects a weak one (W009).
      - name: Django deployment checklist against the hardened profile
        env:
          DJANGO_DEBUG: ""
          ALLOWED_HOSTS: example.com
        run: |
          SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(64))')" \
            python manage.py check --deploy --fail-level WARNING

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bama-saas/ui/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: bama-saas/ui/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Vitest over the pure logic — no DOM, no component rendering. It exists
      # for the things something *else* depends on: `scopeKey` mirrors
      # `ScopedToACar.build_scope_key` on the server and `toman` has to agree
      # with the Telegram notifier quoting the same price. Both tables are
      # asserted on the Python side too, so a drift fails one job or the other.
      - run: npm test
      # The palette's own test: it parses the tokens out of styles.css and fails
      # on a broken contrast ratio or hue gap. Cheap, and the failure it catches
      # is invisible in a screenshot.
      - run: npm run check:contrast
      # The prod image runs this exact build; a broken import must fail here,
      # not halfway through a deploy.
      - run: npm run build
      # Lighthouse runs against the same static production bundle that nginx
      # serves. The config keeps performance tolerant of runner noise while
      # requiring deterministic accessibility, best-practices, and SEO scores.
      - name: Lighthouse
        run: npx --yes @lhci/cli@0.15.1 autorun

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - run: ruff check .
