# Root entry point for the Bama SaaS stack.
#
# The canonical service definitions live in bama-saas/docker-compose.yml
# (postgres + django + optional pgadmin). This file simply includes them so the
# whole project can be started from the repo root with a single command:
#
#     docker-compose up --build            # postgres + django on :5432 / :8000
#     docker-compose --profile dev up      # also start pgadmin on :5050
#
# Phase 8 will extend *this* file with the frontend, worker, and nginx services
# once they exist. Do not duplicate service definitions here — edit the included
# file or add new services below.

include:
  - bama-saas/docker-compose.yml
